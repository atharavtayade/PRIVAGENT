<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIVAGENT Quick Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <div class="logo-shield">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">PRIVAGENT</h1>
          <span class="sub-label">Privacy-First Browser Agent</span>
        </div>
      </div>
      <div class="firewall-status" id="firewallStatus">
        <span class="dot"></span>
        <span class="label">PROTECTED</span>
      </div>
    </header>

    <main class="popup-body">
      <div class="input-group">
        <input 
          type="text" 
          id="popupTaskInput" 
          placeholder="Enter browser task..." 
          autocomplete="off"
        />
        <button id="btnPopupRun" class="btn-run">Run</button>
      </div>

      <div class="action-card">
        <div class="status-summary">
          <span class="summary-label">State:</span>
          <span class="summary-val" id="summaryState">IDLE</span>
        </div>
        <button id="btnOpenSidepanel" class="btn-sidepanel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="15" y1="3" x2="15" y2="21"/>
          </svg>
          <span>Open Split-Screen Side Panel</span>
        </button>
      </div>
    </main>

    <footer class="popup-footer">
      <span>SIH26171 &bull; ISRO Smart Automation</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
